<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicGen Workbench</title>
  <style>
    :root {
      --bg:#050916;
      --panel:#0c132a;
      --panel2:#121c37;
      --txt:#dce8ff;
      --muted:#95aad6;
      --accent:#6af5ff;
      --stroke:rgba(255,255,255,.16);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(140deg,#050916,#131f43);color:var(--txt);font-family:Inter,system-ui,sans-serif;padding:18px}
    .layout{display:grid;grid-template-columns:250px 1fr 280px;gap:14px;max-width:1300px;margin:0 auto}
    .panel{border:1px solid var(--stroke);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:14px;padding:14px;min-height:78vh}
    h2{font-size:.95rem;color:var(--muted);margin:0 0 12px;letter-spacing:.03em;text-transform:uppercase}
    .preset{width:100%;text-align:left;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--txt);padding:10px;border-radius:10px;margin-bottom:8px;cursor:pointer}
    .preset:hover{border-color:var(--accent)}
    label{display:block;font-size:.86rem;color:var(--muted);margin:10px 0 6px}
    textarea,input,select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--stroke);color:var(--txt);border-radius:10px;padding:9px;font:inherit}
    textarea{min-height:110px;resize:vertical}
    .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .actions{display:flex;gap:10px;margin-top:12px}
    button{border:1px solid var(--stroke);background:linear-gradient(135deg,#6af5ff,#74a3ff);color:#091326;padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer}
    button.secondary{background:rgba(255,255,255,.06);color:var(--txt)}
    .stat{font-size:.9rem;color:var(--muted);margin-top:10px}
    canvas{width:100%;height:140px;background:#060b1c;border:1px solid var(--stroke);border-radius:10px}
    .history-item{border:1px solid var(--stroke);border-radius:10px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.03)}
    .history-item strong{display:block;font-size:.86rem}
    .history-item span{font-size:.78rem;color:var(--muted)}
    @media (max-width:1050px){.layout{grid-template-columns:1fr}.panel{min-height:auto}}
  </style>
</head>
<body>
  <main class="layout">
    <aside class="panel">
      <h2>Presets</h2>
      <button class="preset" data-preset="ambient">🌌 Ambient Wash</button>
      <button class="preset" data-preset="upbeat">☀️ Upbeat Pop</button>
      <button class="preset" data-preset="cinematic">🎬 Cinematic Rise</button>
      <button class="preset" data-preset="lofi">📼 Lo-Fi Study</button>
      <button class="preset" data-preset="electronic">⚡ Electronic Drive</button>
    </aside>

    <section class="panel">
      <h2>Generator</h2>
      <label for="prompt">Prompt</label>
      <textarea id="prompt"></textarea>
      <div class="row">
        <div>
          <label for="genre">Genre</label>
          <select id="genre"></select>
        </div>
        <div>
          <label for="seconds">Duration</label>
          <input id="seconds" type="number" min="5" max="60" value="15" />
        </div>
        <div>
          <label for="tempo">Tempo (BPM)</label>
          <input id="tempo" type="number" min="60" max="180" value="120" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="temperature">Temperature</label>
          <input id="temperature" type="range" min="0.1" max="1.5" step="0.05" value="0.8" />
        </div>
        <div>
          <label for="topP">Top-P</label>
          <input id="topP" type="range" min="0.1" max="1" step="0.01" value="0.9" />
        </div>
      </div>
      <div class="actions">
        <button id="generate">Generate</button>
        <button id="download" class="secondary" disabled>Download</button>
      </div>
      <div class="stat" id="stats">Generation time: --</div>
      <canvas id="wave"></canvas>
      <audio id="audio" controls style="width:100%;margin-top:10px;display:none"></audio>
    </section>

    <aside class="panel">
      <h2>History</h2>
      <div id="history"></div>
    </aside>
  </main>

  <script type="module">
    import { GENRE_DEFINITIONS, WebGPUMusicEngine } from '../.model-config/config.js';
    import { MusicModelLoader } from '../.model.load/load.js';

    const PRESETS = {
      ambient: { genre: 'ambient', prompt: 'Slow evolving pads, airy reverb tails, gentle motion.', tempo: 72, temperature: 0.65, topP: 0.92 },
      upbeat: { genre: 'indie', prompt: 'Bright guitars, upbeat groove, catchy chorus energy.', tempo: 126, temperature: 0.9, topP: 0.94 },
      cinematic: { genre: 'cinematic', prompt: 'Epic rise with strings, drums, and heroic motifs.', tempo: 98, temperature: 0.78, topP: 0.9 },
      lofi: { genre: 'lofi', prompt: 'Dusty boom-bap beat, jazzy chords, late-night vibe.', tempo: 84, temperature: 0.58, topP: 0.88 },
      electronic: { genre: 'electronic', prompt: 'Driving synth bass, sidechained pads, club atmosphere.', tempo: 128, temperature: 0.95, topP: 0.96 },
    };

    const $ = (id) => document.getElementById(id);
    const engine = new WebGPUMusicEngine();
    const loader = new MusicModelLoader({ maxEntries: 6 });
    let lastBlob = null;
    const history = [];

    Object.keys(GENRE_DEFINITIONS).forEach((name) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      $('genre').appendChild(option);
    });

    document.querySelectorAll('[data-preset]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const data = PRESETS[btn.dataset.preset];
        $('genre').value = data.genre;
        $('prompt').value = data.prompt;
        $('tempo').value = data.tempo;
        $('temperature').value = data.temperature;
        $('topP').value = data.topP;
        $('seconds').value = 15;
      });
    });

    const drawWave = (buffer) => {
      const canvas = $('wave');
      const ctx = canvas.getContext('2d');
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#6af5ff';
      const step = Math.max(1, Math.floor(buffer.length / width));
      for (let x = 0; x < width; x++) {
        let min = 1, max = -1;
        for (let i = 0; i < step; i++) {
          const v = buffer[x * step + i] ?? 0;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        const y = (1 + min) * height / 2;
        const h = Math.max(1, (max - min) * height / 2);
        ctx.fillRect(x, y, 1, h);
      }
    };

    const renderHistory = () => {
      $('history').innerHTML = '';
      history.slice().reverse().forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const header = `${item.genre} • ${item.seconds}s`;
        const detail = `${item.time} • temp ${item.temperature.toFixed(2)} • top-p ${Number(item.topP ?? 0.9).toFixed(2)} • ${item.ms}ms`;
        div.innerHTML = `<strong>${header}</strong><span>${detail}</span>`;
        $('history').appendChild(div);
      });
    };

    $('generate').addEventListener('click', async () => {
      $('generate').disabled = true;
      const started = performance.now();
      try {
        await engine.initGPU();
        await loader.loadModelVariant('small', () => {});
        const tokenizer = await loader.loadTokenizer();
        const genre = $('genre').value;
        const seconds = Math.max(5, Math.min(60, Number($('seconds').value) || 15));
        const tempo = Math.max(60, Math.min(180, Number($('tempo').value) || 120));
        const temperature = Number($('temperature').value);
        const topP = Number($('topP').value);
        const text = `${genre}: ${GENRE_DEFINITIONS[genre]}. ${$('prompt').value}`;
        const ids = tokenizer.encode(text);
        const tokens = engine.encodePromptTokens(ids.join(' '));

        const { audio, sampleRate } = await engine.generateMusic({
          promptTokens: tokens,
          durationSec: seconds,
          tempo,
          temperature,
        });

        drawWave(audio);
        lastBlob = engine.float32ToWav(audio, sampleRate);
        const url = URL.createObjectURL(lastBlob);
        $('audio').src = url;
        $('audio').style.display = 'block';
        $('download').disabled = false;

        const elapsed = Math.round(performance.now() - started);
        $('stats').textContent = `Generation time: ${elapsed} ms • ${seconds}s rendered`;
        history.push({
          genre,
          seconds,
          temperature,
          topP,
          ms: elapsed,
          time: new Date().toLocaleTimeString(),
        });
        renderHistory();
      } catch (error) {
        $('stats').textContent = `Generation error: ${error.message}`;
      } finally {
        $('generate').disabled = false;
      }
    });

    $('download').addEventListener('click', () => {
      if (!lastBlob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(lastBlob);
      a.download = `studio-${Date.now()}.wav`;
      a.click();
      URL.revokeObjectURL(a.href);
    });
  </script>
</body>
</html>
