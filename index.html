<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browser MusicGen (Transformers.js)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a31;
      --panel-border: #243052;
      --text: #eaf0ff;
      --muted: #9ca8c8;
      --accent: #7c9cff;
      --accent-2: #3cd6b3;
      --danger: #ff6f8d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #162447 0%, var(--bg) 45%);
      color: var(--text);
      font: 16px/1.4 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      width: min(880px, 100%);
      background: color-mix(in srgb, var(--panel) 90%, black 10%);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0; font-size: clamp(1.4rem, 2.5vw, 2rem); }
    p { margin: 8px 0 0; color: var(--muted); }
    .grid {
      margin-top: 18px;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    label { display: grid; gap: 8px; }
    .label { color: var(--muted); font-size: 0.95rem; }
    textarea, input, button {
      border-radius: 10px;
      border: 1px solid #33426e;
      background: #121d38;
      color: var(--text);
      font: inherit;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      padding: 12px;
    }
    input[type='range'] { width: 100%; }
    button {
      padding: 11px 14px;
      cursor: pointer;
      transition: .15s transform ease, .15s background ease;
      font-weight: 600;
    }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .primary {
      background: linear-gradient(120deg, var(--accent), #a17dff);
      border: none;
      color: #081028;
    }
    .secondary {
      background: #122545;
      border-color: #2a497e;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .status {
      margin-top: 12px;
      min-height: 24px;
      color: var(--accent-2);
      font-size: .95rem;
      word-break: break-word;
    }
    .status.error { color: var(--danger); }
    audio { margin-top: 14px; width: 100%; }
    code {
      background: #10172f;
      border: 1px solid #2b3f6d;
      border-radius: 6px;
      padding: 2px 6px;
      color: #c9d8ff;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>AI Music Generator (100% Browser)</h1>
    <p>Uses <code>@huggingface/transformers</code> + Meta MusicGen model in your browser. No API keys, no backend.</p>

    <label style="margin-top: 18px;">
      <span class="label">Prompt</span>
      <textarea id="prompt">epic cinematic orchestral soundtrack, powerful drums, uplifting melody</textarea>
    </label>

    <div class="grid">
      <label>
        <span class="label">Duration: <strong id="secondsLabel">8</strong> seconds</span>
        <input id="seconds" type="range" min="4" max="20" step="1" value="8" />
      </label>
      <label>
        <span class="label">Guidance scale</span>
        <input id="guidance" type="number" min="1" max="10" step="0.5" value="3" />
      </label>
    </div>

    <div class="row" style="margin-top: 16px;">
      <button id="generate" class="primary">Generate Music</button>
      <button id="download" class="secondary" disabled>Download WAV</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
    <audio id="player" controls></audio>
  </main>

  <script type="module">
    import { env, pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.3';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const generateBtn = $('generate');
    const downloadBtn = $('download');
    const player = $('player');

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    let generatorPromise;
    let lastBlob;

    // MusicGen decodes roughly 50 audio tokens per second.
    const TOKENS_PER_SECOND = 50;
    // Keep a small floor so very short durations still produce usable audio.
    const MIN_NEW_TOKENS = 32;
    const DOWNLOAD_URL_REVOKE_DELAY_MS = 1000;
    const candidateModels = [
      'onnx-community/musicgen-small',
      'Xenova/musicgen-small',
      'facebook/musicgen-small'
    ];

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', Boolean(isError));
    }

    function floatTo16BitPCM(view, offset, input) {
      for (let i = 0; i < input.length; i += 1, offset += 2) {
        const s = Math.max(-1, Math.min(1, input[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, value) => {
        for (let i = 0; i < value.length; i += 1) {
          view.setUint8(offset + i, value.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);
      floatTo16BitPCM(view, 44, samples);

      return new Blob([view], { type: 'audio/wav' });
    }

    async function loadGenerator() {
      if (generatorPromise) return generatorPromise;

      generatorPromise = (async () => {
        const canUseWebGPU = typeof navigator !== 'undefined' && 'gpu' in navigator;

        for (const modelId of candidateModels) {
          const devices = canUseWebGPU ? ['webgpu', 'wasm'] : ['wasm'];

          for (const device of devices) {
            try {
              setStatus(`Loading model (${modelId}) on ${device}... first run can take a while.`);
              const generator = await pipeline('text-to-audio', modelId, {
                device,
                progress_callback: (info) => {
                  const pct = Number.isFinite(info?.progress) ? ` ${Math.round(info.progress)}%` : '';
                  const file = info?.file ? ` (${info.file.split('/').pop()})` : '';
                  setStatus(`Loading model (${modelId})${file}${pct}`);
                }
              });

              setStatus(`Model loaded: ${modelId} on ${device}.`);
              return generator;
            } catch (error) {
              console.warn(`Failed loading ${modelId} on ${device}`, error);
            }
          }
        }

        throw new Error('Unable to load a browser-compatible MusicGen model from Hugging Face.');
      })();

      return generatorPromise;
    }

    function normalizeOutput(result) {
      const first = Array.isArray(result) ? result[0] : result;
      if (!first || !first.audio) {
        throw new Error('Model returned no audio data.');
      }

      const audio = Array.isArray(first.audio) ? first.audio[0] : first.audio;
      if (Array.isArray(first.audio) && first.audio.length === 0) {
        throw new Error('Model returned an empty audio array.');
      }
      if (!(audio instanceof Float32Array) && !ArrayBuffer.isView(audio)) {
        throw new Error('Audio output format is not supported.');
      }

      return {
        samples: audio instanceof Float32Array ? audio : new Float32Array(audio),
        samplingRate: Number(first.sampling_rate) || 32000
      };
    }

    $('seconds').addEventListener('input', () => {
      $('secondsLabel').textContent = $('seconds').value;
    });

    generateBtn.addEventListener('click', async () => {
      const prompt = $('prompt').value.trim();
      const durationSeconds = Number($('seconds').value);
      const guidanceScale = Number($('guidance').value);

      if (!prompt) {
        setStatus('Please enter a prompt.', true);
        return;
      }

      if (!Number.isFinite(guidanceScale) || guidanceScale <= 0) {
        setStatus('Guidance scale must be a positive number.', true);
        return;
      }

      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      setStatus('Preparing generator...');

      try {
        const generator = await loadGenerator();
        setStatus('Generating audio... this can take some time depending on your device.');

        const maxNewTokens = Math.max(MIN_NEW_TOKENS, Math.round(durationSeconds * TOKENS_PER_SECOND));
        const output = await generator(prompt, {
          max_new_tokens: maxNewTokens,
          guidance_scale: guidanceScale
        });

        const { samples, samplingRate } = normalizeOutput(output);
        if (lastBlob) URL.revokeObjectURL(player.src);
        lastBlob = encodeWav(samples, samplingRate);
        player.src = URL.createObjectURL(lastBlob);
        player.play().catch((error) => {
          console.warn('Autoplay blocked or playback failed.', error);
        });

        setStatus(`Done. Generated ${durationSeconds}s at ${samplingRate} Hz.`);
        downloadBtn.disabled = false;
      } catch (error) {
        console.error(error);
        setStatus(`Generation failed: ${error?.message || error}`, true);
      } finally {
        generateBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastBlob) return;
      const url = URL.createObjectURL(lastBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'musicgen-output.wav';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), DOWNLOAD_URL_REVOKE_DELAY_MS);
    });
  </script>
</body>
</html>
