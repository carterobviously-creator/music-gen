<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Music Generator</title>
  <style>
    :root{
      --bg1:#090613; --bg2:#140b24; --panel:rgba(17,15,34,.84);
      --line:rgba(255,255,255,.14); --text:#f4eeff; --muted:#c8bfdc;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text); font-family:system-ui,sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(255,100,200,.22), transparent 20%),
        radial-gradient(circle at 84% 18%, rgba(60,150,255,.16), transparent 18%),
        linear-gradient(180deg,var(--bg2),var(--bg1) 58%, #06040d);
    }
    .wrap{width:min(1200px,calc(100vw - 24px)); margin:18px auto 30px}
    .topbar,.panel{
      background:var(--panel); border:1px solid var(--line); border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.45); backdrop-filter:blur(12px);
    }
    .topbar{display:flex; justify-content:space-between; padding:18px 20px; margin-bottom:16px}
    .brand{
      font-size:clamp(28px,4vw,40px); font-weight:900; letter-spacing:2px; text-transform:uppercase;
      background:linear-gradient(90deg,#ff8ef3,#ffd4e8 30%,#80cfff 68%,#d2e8ff);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    .nav{display:flex; gap:18px; color:var(--muted); flex-wrap:wrap; align-items:center}
    .panel{padding:16px; margin-bottom:16px}
    .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px}
    .prompt{display:grid; grid-template-columns:1fr 190px; gap:12px}
    input,select,button,a{
      width:100%; padding:14px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.16);
      background:linear-gradient(180deg, rgba(34,29,59,.98), rgba(16,13,31,.98)); color:#fff; font-size:15px;
    }
    input::placeholder{color:#b7accd}
    button,a{
      cursor:pointer; font-weight:800; border:none; text-align:center; text-decoration:none;
      background:linear-gradient(90deg,#ff62d9,#8b73ff 55%,#42d7ff);
    }
    .desc{margin:12px 2px 0; color:var(--muted); line-height:1.45}
    .title{font-weight:800; margin-bottom:12px; color:#d9d0f3}
    .wave{min-height:230px; border-radius:16px; padding:16px; overflow:hidden; background:rgba(255,255,255,.03)}
    .wave canvas{width:100%; height:170px; display:block; border-radius:14px; background:rgba(5,5,12,.28); border:1px solid rgba(255,255,255,.08)}
    audio{width:100%; margin-top:12px}
    .footerRow{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:10px}
    .pill{border:1px solid rgba(255,255,255,.14); padding:8px 12px; border-radius:999px; background:rgba(255,255,255,.04); color:#e8ddff; font-size:13px}
    .status{color:#dacff2; font-size:14px; opacity:.95}
    .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px}
    .secondary{background:linear-gradient(180deg, rgba(39,35,61,.98), rgba(16,13,31,.98)); border:1px solid rgba(255,255,255,.14)}
    @media (max-width:900px){ .grid4,.prompt,.actions{grid-template-columns:1fr} .topbar{flex-direction:column; gap:12px} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">AI Music Generator</div>
      <div class="nav"><span>My Tracks</span><span>Favorites</span><span>Settings</span></div>
    </div>

    <div class="panel">
      <div class="grid4">
        <select id="genre"><option>Synthwave</option><option>EDM</option><option>Lo-fi</option><option>Cinematic</option><option>Ambient</option></select>
        <select id="mood"><option>Dreamy</option><option>Energetic</option><option>Dark</option><option>Chill</option><option>Epic</option></select>
        <select id="theme"><option>Neon City</option><option>Space</option><option>Retro Arcade</option><option>Cyberpunk</option><option>Midnight Drive</option></select>
        <select id="tempo"><option>Medium</option><option>Slow</option><option>Fast</option></select>
      </div>
      <div class="prompt">
        <input id="prompt" placeholder="Enter your prompt..." />
        <button id="generateBtn">Generate</button>
      </div>
      <div class="desc" id="desc">A nostalgic synthwave track with lush melodies, driving bass, and a retro 80s vibe.</div>
    </div>

    <div class="panel">
      <div class="title">Preview Track</div>
      <div class="wave">
        <canvas id="viz" width="1200" height="170"></canvas>
        <audio id="player" controls></audio>
      </div>
      <div class="footerRow">
        <span class="pill" id="devicePill">Loading model…</span>
        <span class="status" id="status">Use Chrome or Edge for WebGPU.</span>
      </div>
      <div class="actions">
        <button class="secondary" id="regenBtn">Regenerate</button>
        <button class="secondary" id="stopBtn">Stop</button>
        <a class="secondary" id="downloadBtn" download="musicgen.wav" href="#">Download</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { MusicgenForConditionalGeneration, AutoProcessor, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js";

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const $ = id => document.getElementById(id);
    const statusEl = $("status");
    const pill = $("devicePill");
    const desc = $("desc");
    const player = $("player");
    const viz = $("viz");
    const ctx = viz.getContext("2d");

    let model = null;
    let processor = null;
    let currentObjectUrl = null;

    function drawBars() {
      const w = viz.width, h = viz.height;
      ctx.clearRect(0,0,w,h);
      const g = ctx.createLinearGradient(0,0,w,0);
      g.addColorStop(0, "#ff61d7"); g.addColorStop(.25, "#ff9a7b"); g.addColorStop(.55, "#ffd96a"); g.addColorStop(.78, "#91e6ff"); g.addColorStop(1, "#8b73ff");
      for (let i = 0; i < 220; i++) {
        const x = (i / 220) * w;
        const bh = (0.15 + Math.random() * 0.85) * (h * 0.9);
        ctx.fillStyle = g;
        ctx.fillRect(x, (h - bh) / 2, w / 260, bh);
      }
    }

    async function loadModel() {
      statusEl.textContent = "Loading MusicGen…";
      try {
        processor = await AutoProcessor.from_pretrained("Xenova/musicgen-small");
        model = await MusicgenForConditionalGeneration.from_pretrained("Xenova/musicgen-small", {
          dtype: {
            text_encoder: "q8",
            decoder_model_merged: "q8",
            encodec_decode: "fp32",
          },
          device: {
            text_encoder: "webgpu",
            decoder_model_merged: "wasm",
            encodec_decode: "wasm",
          },
        });
        pill.textContent = "Ready";
        statusEl.textContent = "Model loaded.";
      } catch (e) {
        console.error(e);
        pill.textContent = "Load failed";
        statusEl.textContent = "Model load failed. Check console.";
      }
    }

    async function generate() {
      if (!model || !processor) return;
      const prompt = `${$("genre").value} music, ${$("mood").value} mood, ${$("theme").value} theme, ${$("tempo").value} tempo. ${$("prompt").value.trim()}`.trim();
      desc.textContent = prompt;
      statusEl.textContent = "Generating…";
      $("generateBtn").disabled = true;
      $("regenBtn").disabled = true;

      try {
        const inputs = await processor(prompt, { padding: true, return_tensors: "pt" });
        const audio = await model.generate({ ...inputs, max_new_tokens: 256, do_sample: true, guidance_scale: 3 });
        const data = audio[0][0].cpu().float32Array;
        const wav = new Blob([floatToWav(data, 32000)], { type: "audio/wav" });
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(wav);
        player.src = currentObjectUrl;
        $("downloadBtn").href = currentObjectUrl;
        player.play().catch(()=>{});
        statusEl.textContent = "Done.";
        drawBars();
      } catch (e) {
        console.error(e);
        statusEl.textContent = "Generation failed.";
      } finally {
        $("generateBtn").disabled = false;
        $("regenBtn").disabled = false;
      }
    }

    function floatToWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF"); view.setUint32(4, 36 + samples.length * 2, true); writeStr(8, "WAVE");
      writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      writeStr(36, "data"); view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return buffer;
    }

    $("generateBtn").onclick = generate;
    $("regenBtn").onclick = generate;
    $("stopBtn").onclick = () => player.pause();

    drawBars();
    await loadModel();
  </script>
</body>
</html>
