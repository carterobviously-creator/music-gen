<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Music Generator</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,sans-serif;
      color:#fff;
      background:linear-gradient(180deg,#12091f,#090613);
      display:grid;
      place-items:center;
    }
    .card{
      width:min(1100px,calc(100vw - 24px));
      background:rgba(15,12,30,.88);
      border:1px solid rgba(255,255,255,.14);
      border-radius:20px;
      padding:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.45);
    }
    .row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
    .prompt{display:grid;grid-template-columns:1fr 180px;gap:10px}
    input,select,button,a{
      width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
      background:#1c1730;color:#fff;font-size:15px
    }
    button,a{background:linear-gradient(90deg,#ff5fd7,#7d6bff,#42d7ff);border:none;font-weight:700;text-align:center;text-decoration:none}
    .msg{margin-top:12px;color:#d7cfee}
    audio{width:100%;margin-top:14px}
    @media (max-width:900px){.row,.prompt{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Music Generator</h1>
    <div class="row">
      <select id="genre"><option>Synthwave</option><option>EDM</option><option>Lo-fi</option><option>Cinematic</option></select>
      <select id="mood"><option>Dreamy</option><option>Energetic</option><option>Dark</option><option>Chill</option></select>
      <select id="theme"><option>Neon City</option><option>Space</option><option>Cyberpunk</option><option>Retro Arcade</option></select>
      <select id="tempo"><option>Medium</option><option>Slow</option><option>Fast</option></select>
    </div>
    <div class="prompt">
      <input id="prompt" placeholder="Enter your prompt..." />
      <button id="go">Generate</button>
    </div>
    <div class="msg" id="msg">Loading model…</div>
    <audio id="player" controls></audio>
    <p><a id="dl" download="musicgen.wav" href="#">Download</a></p>
  </div>

  <script type="module">
    import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js";

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const msg = document.getElementById("msg");
    const player = document.getElementById("player");
    const dl = document.getElementById("dl");
    let url = null;
    let gen = null;

    async function load() {
      try {
        msg.textContent = "Trying WebGPU…";
        gen = await pipeline("text-to-audio", "Xenova/musicgen-small", { device: "webgpu" });
        msg.textContent = "Ready with WebGPU.";
      } catch (e1) {
        console.warn("WebGPU failed", e1);
        try {
          msg.textContent = "Trying CPU fallback…";
          gen = await pipeline("text-to-audio", "Xenova/musicgen-small", { device: "cpu" });
          msg.textContent = "Ready with CPU fallback.";
        } catch (e2) {
          console.error(e2);
          msg.textContent = "Model load failed. Check browser console.";
        }
      }
    }

    document.getElementById("go").onclick = async () => {
      if (!gen) return;
      const p = `${genre.value} music, ${mood.value} mood, ${theme.value} theme, ${tempo.value} tempo. ${prompt.value.trim()}`.trim();
      msg.textContent = "Generating...";
      const out = await gen(p, { max_new_tokens: 256, do_sample: true, guidance_scale: 3 });
      const audio = out.audio;
      const blob = audio.toBlob ? await audio.toBlob() : new Blob([audio.data], { type: "audio/wav" });
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      player.src = url;
      dl.href = url;
      msg.textContent = "Done.";
    };

    load();
  </script>
</body>
</html>
