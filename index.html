<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Music Generator (WebGPU MusicGen)</title>
  <style>
    :root{
      color-scheme: dark;
      --bg: #0a0a18;
      --panel: #121227;
      --panel2:#1a1a36;
      --text:#edf0ff;
      --muted:#98a2c9;
      --purple:#a855f7;
      --cyan:#22d3ee;
      --pink:#ec4899;
      --err:#fb7185;
      --ok:#34d399;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background: radial-gradient(1000px 500px at 10% -20%, #2b175f 0%, var(--bg) 55%) fixed;
      color:var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 20px;
      display:grid;
      place-items:center;
    }
    .wrap{width:min(980px, 96vw);display:grid;gap:14px}
    .card{
      background: linear-gradient(180deg, rgba(26, 26, 54, .95), rgba(15, 15, 32, .95));
      border:1px solid rgba(168, 85, 247, .25);
      border-radius:16px;
      padding:16px;
      box-shadow:0 12px 28px rgba(0,0,0,.35);
    }
    h1{margin:0;font-size:clamp(1.45rem,2.4vw,2.1rem)}
    .sub{margin-top:6px;color:var(--muted);line-height:1.35}
    .grid{display:grid;grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));gap: 12px;margin-top: 12px}
    label{display:grid;gap:8px}
    .label{color:var(--muted);font-size:.92rem}
    textarea, input, button{
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, .25);
      background: rgba(8, 8, 20, .75);
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
    }
    textarea{width:100%;min-height: 120px;resize: vertical}
    input[type="range"]{accent-color: var(--cyan); padding: 0}
    input[type="number"]{background:#111126;border-color: rgba(236,72,153,.35)}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
    button{cursor:pointer;border: 1px solid transparent;background:#202048;padding: 10px 14px;font-weight:700}
    button:hover{filter:brightness(1.07)}
    button.primary{background: linear-gradient(90deg, var(--purple), var(--cyan));color:#0a0a18}
    button.ghost{background:transparent;border-color: rgba(236,72,153,.35)}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{margin-top: 10px;color: var(--muted);min-height: 1.2em;word-break: break-word}
    .status.ok{color: var(--ok)}
    .status.err{color: var(--err)}
    audio{width:100%; margin-top: 10px;}
    .error{margin-top: 10px;padding: 10px 12px;border-radius: 12px;border: 1px solid rgba(251,113,133,.6);color: #ffd5de;background: rgba(80, 20, 40, .35);display:none}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;border:1px solid rgba(34,211,238,.25);background: rgba(14, 14, 31, .85);color: var(--muted);font-size: .9rem;margin-top: 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .fine{color:var(--muted); font-size: .86rem; margin-top: 6px}
    code{background: rgba(255,255,255,.06); padding:2px 6px; border-radius:8px; border: 1px solid rgba(255,255,255,.10)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>🎵 AI Music Generator (WebGPU)</h1>
      <div class="sub">
        Runs <code>MusicGen</code> fully in your browser via <code>@huggingface/transformers</code> using <b>WebGPU</b>.
        No API keys, no backend.
      </div>
      <div class="pill" id="gpuInfo">Checking WebGPU support…</div>
      <div id="errorBox" class="error"><div id="errorText">Something went wrong.</div></div>
    </section>

    <section class="card">
      <label>
        <span class="label">Prompt</span>
        <textarea id="prompt" placeholder="e.g. chill lo-fi hip hop, warm vinyl crackle, mellow drums, 90 bpm">epic cinematic orchestral soundtrack, powerful drums, uplifting melody</textarea>
      </label>

      <div class="grid">
        <label>
          <span class="label">Duration: <strong id="secondsLabel">8</strong> seconds</span>
          <input id="seconds" type="range" min="4" max="20" step="1" value="8" />
        </label>
        <label>
          <span class="label">Guidance scale</span>
          <input id="guidance" type="number" min="1" max="10" step="0.5" value="3" />
        </label>
      </div>

      <div class="row">
        <button id="generate" class="primary">Generate Music</button>
        <button id="download" class="ghost" disabled>⬇ Download WAV</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">Ready.</div>
      <div class="fine">Tip: first load can take a while while the model downloads + compiles on your GPU.</div>

      <audio id="player" controls></audio>
    </section>
  </main>

  <script type="module">
    import { env, pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.3';

    const $ = (id) => document.getElementById(id);
    const statusEl = $('status');
    const generateBtn = $('generate');
    const downloadBtn = $('download');
    const player = $('player');
    const errorBox = $('errorBox');
    const errorText = $('errorText');
    const gpuInfo = $('gpuInfo');

    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const MODEL_ID = 'Xenova/musicgen-small';
    const TOKENS_PER_SECOND = 50;
    const MIN_NEW_TOKENS = 32;
    const DOWNLOAD_URL_REVOKE_DELAY_MS = 1000;

    let generatorPromise;
    let lastBlob;

    function setStatus(message, kind = '') {
      statusEl.textContent = message;
      statusEl.classList.remove('ok', 'err');
      if (kind) statusEl.classList.add(kind);
    }

    function showError(message) {
      errorText.textContent = message;
      errorBox.style.display = 'block';
      setStatus(message, 'err');
    }

    function clearError() {
      errorBox.style.display = 'none';
      errorText.textContent = '';
    }

    function floatTo16BitPCM(view, offset, input) {
      for (let i = 0; i < input.length; i += 1, offset += 2) {
        const s = Math.max(-1, Math.min(1, input[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      const writeString = (offset, value) => {
        for (let i = 0; i < value.length; i += 1) view.setUint8(offset + i, value.charCodeAt(i));
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);
      floatTo16BitPCM(view, 44, samples);

      return new Blob([view], { type: 'audio/wav' });
    }

    function normalizeOutput(result) {
      const first = Array.isArray(result) ? result[0] : result;
      if (!first || !first.audio) throw new Error('Model returned no audio data.');

      const audio = Array.isArray(first.audio) ? first.audio[0] : first.audio;
      if (Array.isArray(first.audio) && first.audio.length === 0) throw new Error('Model returned an empty audio array.');
      if (!(audio instanceof Float32Array) && !ArrayBuffer.isView(audio)) throw new Error('Audio output format is not supported.');

      return {
        samples: audio instanceof Float32Array ? audio : new Float32Array(audio),
        samplingRate: Number(first.sampling_rate) || 32000
      };
    }

    async function loadGeneratorWebGPUOnly() {
      if (generatorPromise) return generatorPromise;

      generatorPromise = (async () => {
        if (!(typeof navigator !== 'undefined' && 'gpu' in navigator)) {
          throw new Error('WebGPU is required. Please use Chrome or Edge with WebGPU enabled.');
        }

        setStatus(`Loading model (${MODEL_ID}) on WebGPU... first run can take a while.`);
        const generator = await pipeline('text-to-audio', MODEL_ID, {
          device: 'webgpu',
          dtype: {
            text_encoder: 'q8',
            decoder_model_merged: 'q8',
            encodec_decode: 'q8'
          },
          progress_callback: (info) => {
            const pct = Number.isFinite(info?.progress) ? ` ${Math.round(info.progress)}%` : '';
            const file = info?.file ? ` (${info.file.split('/').pop()})` : '';
            setStatus(`Loading model${file}${pct}`);
          }
        });

        setStatus(`Model loaded: ${MODEL_ID} (WebGPU).`, 'ok');
        return generator;
      })();

      return generatorPromise;
    }

    $('seconds').addEventListener('input', () => {
      $('secondsLabel').textContent = $('seconds').value;
    });

    const hasWebGPU = (typeof navigator !== 'undefined' && 'gpu' in navigator);
    if (hasWebGPU) {
      gpuInfo.textContent = 'WebGPU: available';
      generateBtn.disabled = false;
    } else {
      gpuInfo.textContent = 'WebGPU: not available';
      generateBtn.disabled = true;
      showError('WebGPU is required. Use Chrome/Edge (desktop) with WebGPU enabled.');
    }

    generateBtn.addEventListener('click', async () => {
      clearError();

      const prompt = $('prompt').value.trim();
      const durationSeconds = Number($('seconds').value);
      const guidanceScale = Number($('guidance').value);

      if (!prompt) return showError('Please enter a prompt.');
      if (!Number.isFinite(guidanceScale) || guidanceScale <= 0) return showError('Guidance scale must be a positive number.');

      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      setStatus('Preparing generator…');

      try {
        const generator = await loadGeneratorWebGPUOnly();
        setStatus('Generating audio… (this can take time depending on your GPU)');

        const maxNewTokens = Math.max(MIN_NEW_TOKENS, Math.round(durationSeconds * TOKENS_PER_SECOND));

        const output = await generator(prompt, {
          max_new_tokens: maxNewTokens,
          guidance_scale: guidanceScale,
          speaker_embeddings: null
        });

        const { samples, samplingRate } = normalizeOutput(output);

        if (player.src) URL.revokeObjectURL(player.src);
        lastBlob = encodeWav(samples, samplingRate);
        player.src = URL.createObjectURL(lastBlob);

        player.play().catch(() => {});
        setStatus(`Done. Generated ${durationSeconds}s at ${samplingRate} Hz.`, 'ok');
        downloadBtn.disabled = false;
      } catch (err) {
        console.error(err);
        showError(`Generation failed: ${err?.message || err}`);
      } finally {
        generateBtn.disabled = !hasWebGPU;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!lastBlob) return;
      const url = URL.createObjectURL(lastBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'musicgen-webgpu.wav';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), DOWNLOAD_URL_REVOKE_DELAY_MS);
    });
  </script>
</body>
</html>
