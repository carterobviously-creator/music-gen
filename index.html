<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pollinations AI Music Generator</title>
  <style>
    :root {
      --bg: #0a0a18;
      --panel: #13132a;
      --panel-2: #1a1a38;
      --text: #eef0ff;
      --muted: #9ca3bf;
      --purple: #a855f7;
      --cyan: #22d3ee;
      --pink: #ec4899;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 25% 0%, #22164d 0%, var(--bg) 45%) fixed;
      min-height: 100vh;
      padding: 16px;
    }
    .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
    .card {
      background: linear-gradient(180deg, rgba(168,85,247,0.07), rgba(34,211,238,0.04)), var(--panel);
      border: 1px solid rgba(168,85,247,.25);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 3vw, 2rem); }
    .sub { color: var(--muted); margin: 0 0 10px; }
    textarea {
      width: 100%; min-height: 140px; resize: vertical; border-radius: 10px;
      border: 1px solid rgba(34,211,238,.45); background: var(--panel-2); color: var(--text);
      padding: 12px; font: inherit;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip {
      border: 1px solid rgba(236,72,153,.45); color: #ffd6ef; background: rgba(236,72,153,.1);
      border-radius: 999px; padding: 7px 10px; cursor: pointer; font-size: .85rem;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button {
      border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--purple), var(--pink)); color: white; font-weight: 700;
    }
    button.ghost { background: #202047; border: 1px solid rgba(34,211,238,.4); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .meta {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px;
      margin-top: 10px;
    }
    .pill { background: #1d1d3e; border-radius: 9px; padding: 8px 10px; color: #cfd2ff; font-size: .9rem; }
    .status { margin-top: 10px; color: var(--cyan); min-height: 1.3em; }
    .status.ok { color: var(--ok); }
    .error {
      display: none; margin-top: 10px; color: #ffd9d9; background: rgba(248,113,113,.12);
      border: 1px solid rgba(248,113,113,.55); border-radius: 9px; padding: 9px;
    }
    .progressOuter { margin-top: 10px; background: #11112a; border-radius: 999px; height: 10px; overflow: hidden; }
    .progressInner {
      height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      transition: width .15s linear;
    }
    canvas {
      width: 100%; height: 170px; border-radius: 10px; margin-top: 10px;
      border: 1px solid rgba(34,211,238,.4); background: #0a0a16;
    }
    @media (max-width: 600px) { body { padding: 10px; } .card { padding: 12px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>🎵 Pollinations AI Music Generator</h1>
      <p class="sub">Real AI generation in-browser (no API keys). For long songs, it generates multiple AI segments and stitches them into one buffer.</p>
      <textarea id="prompt" placeholder="Example: a chill lo-fi hip hop beat at 80 BPM, 10 minutes long, relaxing"></textarea>
      <div class="chips" id="chips"></div>
      <div class="row">
        <button id="generateBtn">Generate Music</button>
        <button id="playBtn" class="ghost" disabled>Play</button>
        <button id="pauseBtn" class="ghost" disabled>Pause</button>
        <button id="stopBtn" class="ghost" disabled>Stop</button>
        <button id="downloadBtn" class="ghost" disabled>Download WAV</button>
      </div>
      <div class="meta">
        <div class="pill" id="endpointInfo">Endpoint: pending</div>
        <div class="pill" id="durationInfo">Duration target: pending</div>
        <div class="pill" id="modeInfo">Mode: waiting</div>
      </div>
      <div class="status" id="status">Ready.</div>
      <div class="progressOuter"><div class="progressInner" id="progress"></div></div>
      <div class="error" id="errorBox">
        <div id="errorText"></div>
        <div style="margin-top:8px;"><button id="retryBtn" class="ghost">Retry</button></div>
      </div>
    </section>

    <section class="card">
      <h2 style="margin:0 0 8px;">Visualizer & Playback</h2>
      <canvas id="viz" width="960" height="260"></canvas>
      <div class="status" id="playbackStatus">Playback: stopped</div>
      <div class="progressOuter"><div class="progressInner" id="playbackProgress"></div></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const EXAMPLES = [
      'a chill lo-fi hip hop beat at 80 BPM, 10 minutes long, relaxing',
      'cinematic ambient soundtrack, 15 min, evolving and emotional',
      'upbeat synthwave track 120 bpm, 12 minutes, neon city night drive',
      'deep focus piano and soft strings, 20 minutes, calm and minimal'
    ];

    const ENDPOINTS = [
      {
        name: 'Pollinations OpenAI POST',
        type: 'post-openai',
        model: 'openai-audio',
        buildRequest: (prompt) => ({
          url: 'https://text.pollinations.ai/openai',
          options: {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'openai-audio',
              modalities: ['text', 'audio'],
              audio: { voice: 'alloy', format: 'wav' },
              messages: [{ role: 'user', content: prompt }]
            })
          }
        })
      },
      {
        name: 'Pollinations Text GET',
        type: 'get-text',
        model: 'openai-audio',
        buildRequest: (prompt) => ({
          url: `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai-audio&voice=alloy`,
          options: { method: 'GET' }
        })
      },
      {
        name: 'Pollinations Audio GET',
        type: 'get-audio',
        model: 'audio.pollinations.ai',
        buildRequest: (prompt) => ({
          url: `https://audio.pollinations.ai/${encodeURIComponent(prompt)}`,
          options: { method: 'GET' }
        })
      }
    ];

    const state = {
      audioCtx: null,
      analyser: null,
      source: null,
      fullBuffer: null,
      endpointUsed: 'none',
      playbackStartTime: 0,
      pausedAt: 0,
      raf: 0,
      retryFn: null
    };
    const DEFAULT_MINUTES = 3;
    const DEFAULT_BPM = 90;
    const SEGMENT_SECONDS = 45;

    function setStatus(text, ok = false) {
      const el = $('status');
      el.textContent = text;
      el.classList.toggle('ok', !!ok);
    }

    function setProgress(percent) {
      $('progress').style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function setPlaybackProgress(percent) {
      $('playbackProgress').style.width = `${Math.max(0, Math.min(100, percent))}%`;
    }

    function showError(message, retryFn = null) {
      $('errorText').textContent = message;
      $('errorBox').style.display = 'block';
      state.retryFn = retryFn;
    }

    function clearError() {
      $('errorBox').style.display = 'none';
      state.retryFn = null;
    }

    function parseDurationMinutes(prompt) {
      const text = prompt.toLowerCase();
      const mins = text.match(/(\d+(?:\.\d+)?)\s*(minutes|minute|mins|min)\b/);
      if (mins) return Math.max(1, Number(mins[1]));
      const hrs = text.match(/(\d+(?:\.\d+)?)\s*(hours|hour|hrs|hr)\b/);
      if (hrs) return Math.max(1, Number(hrs[1]) * 60);
      return DEFAULT_MINUTES;
    }

    function parseBpm(prompt) {
      const bpm = prompt.toLowerCase().match(/(\d{2,3})\s*bpm\b/);
      if (bpm) return Math.max(50, Math.min(200, Number(bpm[1])));
      return DEFAULT_BPM;
    }

    function buildSegmentPrompt(basePrompt, segmentIndex, totalSegments) {
      return `${basePrompt}. segment ${segmentIndex + 1} of ${totalSegments}. Continue same style and key with subtle variation.`;
    }

    function base64ToArrayBuffer(base64) {
      const binary = atob(base64);
      return Uint8Array.from(binary, (c) => c.charCodeAt(0)).buffer;
    }

    async function getAudioBufferFromResponse(response, endpointType) {
      const ct = (response.headers.get('content-type') || '').toLowerCase();
      if (endpointType === 'post-openai' || ct.includes('application/json') || ct.includes('text/plain')) {
        const data = await response.json();
        const b64 = data?.choices?.[0]?.message?.audio?.data || data?.audio?.data || data?.data;
        if (!b64 || typeof b64 !== 'string') throw new Error('No base64 audio returned');
        return base64ToArrayBuffer(b64);
      }
      return await response.arrayBuffer();
    }

    async function fetchOnePollinationsSegment(prompt) {
      const failures = [];
      for (const endpoint of ENDPOINTS) {
        try {
          const req = endpoint.buildRequest(prompt);
          const response = await fetch(req.url, req.options);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const audioData = await getAudioBufferFromResponse(response, endpoint.type);
          state.endpointUsed = `${endpoint.name} (${endpoint.model})`;
          $('endpointInfo').textContent = `Endpoint: ${state.endpointUsed}`;
          return audioData;
        } catch (err) {
          failures.push(`${endpoint.name}: ${err.message}`);
        }
      }
      throw new Error(`All Pollinations endpoints failed. ${failures.join(' | ')}`);
    }

    function ensureAudioCtx() {
      if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return state.audioCtx;
    }

    async function decodeAudio(arrayBuffer) {
      const ctx = ensureAudioCtx();
      const cloned = arrayBuffer.slice(0);
      return await ctx.decodeAudioData(cloned);
    }

    function concatAudioBuffers(buffers) {
      if (!buffers.length) return null;
      const sampleRate = buffers[0].sampleRate;
      const channelCount = Math.max(...buffers.map((b) => b.numberOfChannels));
      const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);
      const ctx = ensureAudioCtx();
      const out = ctx.createBuffer(channelCount, totalLength, sampleRate);
      let offset = 0;
      for (const b of buffers) {
        for (let ch = 0; ch < channelCount; ch += 1) {
          const target = out.getChannelData(ch);
          // When sources have different channel counts, duplicate the last source channel.
          const src = b.getChannelData(Math.min(ch, b.numberOfChannels - 1));
          target.set(src, offset);
        }
        offset += b.length;
      }
      return out;
    }

    function createProceduralFallback(seconds, bpm) {
      const ctx = ensureAudioCtx();
      const sr = ctx.sampleRate;
      const length = Math.floor(seconds * sr);
      const out = ctx.createBuffer(2, length, sr);
      const beat = 60 / bpm;
      const kickHz = 55;
      const bassHz = 82.41;
      for (let ch = 0; ch < 2; ch += 1) {
        const data = out.getChannelData(ch);
        for (let i = 0; i < length; i += 1) {
          const t = i / sr;
          const beatPos = (t % beat) / beat;
          const barPos = (t % (beat * 4)) / (beat * 4);
          const kickEnv = Math.exp(-beatPos * 16) * (beatPos < 0.22 ? 1 : 0);
          const snareTrig = ((t + beat * 0.5) % beat) / beat;
          const snareEnv = Math.exp(-snareTrig * 25) * (snareTrig < 0.12 ? 1 : 0);
          const hat = ((Math.random() * 2 - 1) * 0.05) * (1 - ((t * 8) % 1));
          const kick = Math.sin(2 * Math.PI * kickHz * t * (1 - beatPos * 0.6)) * kickEnv * 0.65;
          const bass = Math.sin(2 * Math.PI * (bassHz + 24 * Math.sin(barPos * Math.PI * 2)) * t) * 0.22;
          const pad = (Math.sin(2 * Math.PI * 220 * t) + Math.sin(2 * Math.PI * 330 * t)) * 0.08;
          const snare = (Math.random() * 2 - 1) * snareEnv * 0.22;
          data[i] = Math.max(-1, Math.min(1, kick + bass + pad + snare + hat));
        }
      }
      return out;
    }

    async function generateSong() {
      clearError();
      setPlaybackProgress(0);
      const prompt = $('prompt').value.trim();
      if (!prompt) return showError('Please enter a prompt.', null);

      const minutes = parseDurationMinutes(prompt);
      const bpm = parseBpm(prompt);
      const totalSeconds = Math.round(minutes * 60);
      $('durationInfo').textContent = `Duration target: ~${minutes.toFixed(1)} min (${totalSeconds}s)`;

      $('generateBtn').disabled = true;
      $('playBtn').disabled = true;
      $('pauseBtn').disabled = true;
      $('stopBtn').disabled = true;
      $('downloadBtn').disabled = true;

      const segmentsNeeded = Math.max(1, Math.ceil(totalSeconds / SEGMENT_SECONDS));
      const decoded = [];

      try {
        $('modeInfo').textContent = 'Mode: Pollinations AI';
        setStatus('AI generating...', false);

        for (let i = 0; i < segmentsNeeded; i += 1) {
          setStatus(`AI generating... segment ${i + 1}/${segmentsNeeded}`);
          setProgress((i / segmentsNeeded) * 100);
          const segmentPrompt = buildSegmentPrompt(prompt, i, segmentsNeeded);
          const rawAudio = await fetchOnePollinationsSegment(segmentPrompt);
          const audioBuffer = await decodeAudio(rawAudio);
          decoded.push(audioBuffer);
        }

        state.fullBuffer = concatAudioBuffers(decoded);
        setProgress(100);
        setStatus('AI generation complete.', true);
      } catch (err) {
        setStatus('AI failed, switching to procedural fallback...');
        $('modeInfo').textContent = 'Mode: Procedural fallback';
        state.endpointUsed = 'fallback (Web Audio synthesis)';
        $('endpointInfo').textContent = `Endpoint: ${state.endpointUsed}`;
        state.fullBuffer = createProceduralFallback(totalSeconds, bpm);
        setProgress(100);
        showError(`Pollinations unavailable. Using fallback engine. Details: ${err.message}`, generateSong);
      } finally {
        $('generateBtn').disabled = false;
      }

      const hasAudio = !!state.fullBuffer;
      $('playBtn').disabled = !hasAudio;
      $('pauseBtn').disabled = !hasAudio;
      $('stopBtn').disabled = !hasAudio;
      $('downloadBtn').disabled = !hasAudio;
      if (hasAudio) {
        state.pausedAt = 0;
        $('playbackStatus').textContent = `Playback: ready (${state.fullBuffer.duration.toFixed(1)}s)`;
      }
    }

    function connectVisualizer(sourceNode) {
      const ctx = ensureAudioCtx();
      if (!state.analyser) {
        state.analyser = ctx.createAnalyser();
        state.analyser.fftSize = 2048;
      }
      sourceNode.connect(state.analyser);
      state.analyser.connect(ctx.destination);
      drawVisualizer();
    }

    function stopPlayback() {
      if (state.source) {
        try { state.source.stop(); } catch (err) { console.debug('stopPlayback stop() ignored:', err); }
        state.source.disconnect();
      }
      state.source = null;
      cancelAnimationFrame(state.raf);
      state.raf = 0;
      state.pausedAt = 0;
      setPlaybackProgress(0);
      $('playbackStatus').textContent = 'Playback: stopped';
    }

    async function play(startOffset = null) {
      if (!state.fullBuffer) return;
      const ctx = ensureAudioCtx();
      await ctx.resume();
      if (state.source) {
        try { state.source.stop(); } catch (err) { console.debug('play restart stop() ignored:', err); }
      }
      const src = ctx.createBufferSource();
      src.buffer = state.fullBuffer;
      connectVisualizer(src);
      state.source = src;
      const offset = startOffset ?? state.pausedAt ?? 0;
      state.playbackStartTime = ctx.currentTime - offset;
      src.start(0, offset);
      src.onended = () => {
        if (!state.source) return;
        state.source = null;
        state.pausedAt = 0;
        setPlaybackProgress(100);
        $('playbackStatus').textContent = 'Playback: finished';
      };
      $('playbackStatus').textContent = 'Playback: playing';
      updatePlaybackProgressLoop();
    }

    function pause() {
      const ctx = ensureAudioCtx();
      if (!state.source || !state.fullBuffer) return;
      state.pausedAt = Math.max(0, ctx.currentTime - state.playbackStartTime);
      try { state.source.stop(); } catch (err) { console.debug('pause stop() ignored:', err); }
      state.source = null;
      $('playbackStatus').textContent = `Playback: paused at ${state.pausedAt.toFixed(1)}s`;
    }

    function updatePlaybackProgressLoop() {
      if (!state.fullBuffer || !state.source) return;
      const ctx = ensureAudioCtx();
      const elapsed = Math.max(0, ctx.currentTime - state.playbackStartTime);
      const pct = (elapsed / state.fullBuffer.duration) * 100;
      setPlaybackProgress(pct);
      if (pct < 100 && state.source) state.raf = requestAnimationFrame(updatePlaybackProgressLoop);
    }

    function drawVisualizer() {
      if (!state.analyser) return;
      const canvas = $('viz');
      const c = canvas.getContext('2d');
      const bins = new Uint8Array(state.analyser.frequencyBinCount);

      const loop = () => {
        if (!state.analyser) return;
        state.analyser.getByteFrequencyData(bins);
        c.clearRect(0, 0, canvas.width, canvas.height);
        const grad = c.createLinearGradient(0, 0, canvas.width, 0);
        grad.addColorStop(0, '#22d3ee');
        grad.addColorStop(0.5, '#a855f7');
        grad.addColorStop(1, '#ec4899');
        c.fillStyle = grad;
        const barW = canvas.width / bins.length * 2.8;
        let x = 0;
        for (let i = 0; i < bins.length; i += 3) {
          const h = (bins[i] / 255) * canvas.height;
          c.fillRect(x, canvas.height - h, barW, h);
          x += barW + 1;
          if (x > canvas.width) break;
        }
        state.raf = requestAnimationFrame(loop);
      };
      cancelAnimationFrame(state.raf);
      state.raf = requestAnimationFrame(loop);
    }

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const format = 1;
      const bitDepth = 16;
      const numSamples = buffer.length;
      const blockAlign = numChannels * bitDepth / 8;
      const byteRate = sampleRate * blockAlign;
      const dataSize = numSamples * blockAlign;
      const out = new ArrayBuffer(44 + dataSize);
      const view = new DataView(out);

      const writeStr = (offset, s) => { for (let i = 0; i < s.length; i += 1) view.setUint8(offset + i, s.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, format, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeStr(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < numSamples; i += 1) {
        for (let ch = 0; ch < numChannels; ch += 1) {
          const sample = buffer.getChannelData(ch)[i] || 0;
          const s = Math.max(-1, Math.min(1, sample));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    function downloadWav() {
      if (!state.fullBuffer) return;
      const blob = audioBufferToWav(state.fullBuffer);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'pollinations-ai-music.wav';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function initChips() {
      const container = $('chips');
      EXAMPLES.forEach((text) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.textContent = text;
        b.type = 'button';
        b.addEventListener('click', () => { $('prompt').value = text; });
        container.appendChild(b);
      });
    }

    $('generateBtn').addEventListener('click', generateSong);
    $('playBtn').addEventListener('click', () => play());
    $('pauseBtn').addEventListener('click', pause);
    $('stopBtn').addEventListener('click', stopPlayback);
    $('downloadBtn').addEventListener('click', downloadWav);
    $('retryBtn').addEventListener('click', () => state.retryFn && state.retryFn());

    initChips();
  </script>
</body>
</html>
