<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Music Generator • Pollinations</title>
  <style>
    :root {
      --bg: #0a0a18;
      --panel: #121227;
      --panel-2: #1a1a36;
      --text: #edf0ff;
      --muted: #98a2c9;
      --purple: #a855f7;
      --cyan: #22d3ee;
      --pink: #ec4899;
      --green: #34d399;
      --err: #fb7185;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1000px 500px at 10% -20%, #2b175f 0%, var(--bg) 55%) fixed;
    }
    .wrap {
      width: min(1100px, 95vw);
      margin: 22px auto 48px;
      display: grid;
      gap: 14px;
    }
    .card {
      background: linear-gradient(180deg, rgba(26, 26, 54, .95), rgba(15, 15, 32, .95));
      border: 1px solid rgba(168, 85, 247, .25);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    h1 { margin: 0; font-size: clamp(1.45rem, 2.4vw, 2.1rem); }
    .sub { margin-top: 4px; color: var(--muted); }
    textarea {
      width: 100%; min-height: 130px; resize: vertical;
      border-radius: 12px; border: 1px solid rgba(34, 211, 238, .25);
      background: rgba(8, 8, 20, .75); color: var(--text);
      padding: 12px; font-size: 1rem;
    }
    .chips, .row { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip, button, input, .range { border-radius: 10px; border: 1px solid transparent; }
    .chip, button {
      padding: 8px 11px; cursor: pointer; color: var(--text);
      background: #202048;
    }
    .chip:hover, button:hover { filter: brightness(1.07); }
    button.primary {
      background: linear-gradient(90deg, var(--purple), var(--cyan));
      color: #0a0a18; font-weight: 700;
    }
    button.ghost { border-color: rgba(236,72,153,.35); background: transparent; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 8px; }
    .pill {
      padding: 8px 10px; border-radius: 999px; font-size: .92rem;
      border: 1px solid rgba(34,211,238,.25); background: rgba(14, 14, 31, .85);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .progressOuter {
      width: 100%; height: 12px; margin: 8px 0 4px;
      border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08);
    }
    .progressInner {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink));
      transition: width .2s ease;
    }
    .status { color: var(--muted); }
    .error {
      margin-top: 10px; padding: 10px 12px; border-radius: 12px;
      border: 1px solid rgba(251,113,133,.6); color: #ffd5de;
      background: rgba(80, 20, 40, .35); display: none;
    }
    canvas {
      width: 100%; height: clamp(170px, 30vw, 270px);
      border: 1px solid rgba(168,85,247,.3); border-radius: 12px;
      background: linear-gradient(180deg, #0a0a18, #070713);
    }
    .timeline { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
    input[type="range"] { width: 100%; accent-color: var(--cyan); }
    .advanced details { border: 1px solid rgba(34,211,238,.25); border-radius: 10px; padding: 8px 10px; }
    .advancedGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 8px; }
    .label { display: block; color: var(--muted); font-size: .92rem; margin-bottom: 6px; }
    input[type="number"] {
      width: 100%; background: #111126; color: var(--text);
      border: 1px solid rgba(236,72,153,.35); padding: 8px;
    }
    .small { font-size: .86rem; color: var(--muted); }
    @media (max-width: 720px) { .row button { flex: 1 1 calc(50% - 8px); } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>🎵 AI Music Generator</h1>
      <div class="sub">Powered by Pollinations AI • no API key required</div>
    </section>

    <section class="card">
      <textarea id="prompt" placeholder="Describe your music... e.g. chill lo-fi hip hop, 20 minutes, 80 BPM"></textarea>
      <div class="chips" id="chips"></div>
      <div class="row" style="margin-top:10px;">
        <button id="generateBtn" class="primary">Generate Music</button>
        <button id="playBtn" class="ghost" disabled>▶ Play</button>
        <button id="pauseBtn" class="ghost" disabled>⏸ Pause</button>
        <button id="stopBtn" class="ghost" disabled>⏹ Stop</button>
        <button id="backBtn" class="ghost" disabled>◀◀ 15s</button>
        <button id="fwdBtn" class="ghost" disabled>15s ▶▶</button>
      </div>
      <div class="meta">
        <div class="pill" id="nowInfo">🎵 Generating: Waiting</div>
        <div class="pill" id="durInfo">Duration: —</div>
        <div class="pill" id="segInfo">Segments: —</div>
      </div>
      <div class="status" id="status">Ready.</div>
      <div class="progressOuter"><div id="progress" class="progressInner"></div></div>
      <div class="small" id="progressMeta">Segment 0 of 0 • ETA —</div>
      <div id="errorBox" class="error">
        <div id="errorText">Something went wrong.</div>
        <div style="margin-top:8px"><button id="retryBtn" class="ghost">Retry</button></div>
      </div>
    </section>

    <section class="card">
      <canvas id="visualizer" width="1200" height="260"></canvas>
      <div class="timeline" style="margin-top:8px;">
        <span id="elapsed">00:00</span>
        <input id="seek" type="range" min="0" max="100" step="0.1" value="0" />
        <span id="total">00:00</span>
      </div>
    </section>

    <section class="card advanced">
      <details>
        <summary>⚙ Advanced Settings</summary>
        <div class="advancedGrid">
          <label>
            <span class="label">Duration (minutes): <strong id="durLabel">10</strong></span>
            <input id="durationSlider" type="range" min="10" max="120" value="10" />
          </label>
          <label>
            <span class="label">BPM Override (optional)</span>
            <input id="bpmOverride" type="number" min="40" max="220" step="1" placeholder="Auto from prompt" />
          </label>
          <label>
            <span class="label">Volume: <strong id="volLabel">80%</strong></span>
            <input id="volumeSlider" type="range" min="0" max="100" value="80" />
          </label>
          <div>
            <span class="label">Output</span>
            <button id="downloadBtn" class="ghost" disabled>⬇ Download WAV</button>
            <button id="regenBtn" class="ghost" disabled style="margin-left:8px;">🔄 Regenerate</button>
            <div class="small" id="endpoint">Endpoint: https://gen.pollinations.ai/audio/{prompt}</div>
          </div>
        </div>
      </details>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const EXAMPLES = [
      'chill lo-fi hip hop, 20 minutes, 80 bpm',
      'epic cinematic orchestral, 15 min, 110 bpm',
      'ambient relaxing drone, 30 minutes',
      'jazz piano smooth acoustic, 12 min, 95 bpm',
      'edm dance upbeat synth, 10 minutes, 128 bpm'
    ];
    const SEGMENT_SECONDS_EST = 45;
    const FETCH_BATCH = 3;
    const MAX_RETRIES = 2;

    const state = {
      audioCtx: null,
      analyser: null,
      compressor: null,
      gain: null,
      source: null,
      fullBuffer: null,
      playbackStartedAt: 0,
      pausedAt: 0,
      raf: 0,
      tick: 0,
      isPlaying: false,
      lastPrompt: '',
      retryFn: null,
      durationTouched: false
    };

    const keywordMap = [
      [/\blo\s*-?fi\b|\bchill\b/i, 'lofi hip hop chill relaxing study beats'],
      [/\bjazz\b/i, 'jazz piano smooth acoustic'],
      [/\bedm\b|\belectronic\b|\bdance\b/i, 'electronic dance music upbeat synth'],
      [/\bambient\b|\brelaxing\b/i, 'ambient atmospheric relaxing calm drone'],
      [/\bepic\b|\bcinematic\b/i, 'epic cinematic orchestral dramatic'],
      [/\bdark\b/i, 'dark atmospheric minor key mysterious'],
      [/\bpop\b|\bupbeat\b|\bhappy\b/i, 'pop upbeat bright cheerful'],
      [/\bhip\s*hop\b|\btrap\b/i, 'hip hop trap beat 808 bass'],
      [/\bpiano\b/i, 'solo piano emotional beautiful']
    ];

    function ensureAudio() {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        state.gain = state.audioCtx.createGain();
        state.gain.gain.value = Number($('volumeSlider').value) / 100;
        state.analyser = state.audioCtx.createAnalyser();
        state.analyser.fftSize = 2048;
        state.analyser.smoothingTimeConstant = 0.8;
        state.compressor = state.audioCtx.createDynamicsCompressor();
        state.gain.connect(state.analyser);
        state.analyser.connect(state.compressor);
        state.compressor.connect(state.audioCtx.destination);
      }
      return state.audioCtx;
    }

    function parseBpm(prompt) {
      const match = prompt.match(/(?:\btempo\b|\bbpm\b)?\s*(\d{2,3})\s*\b(?:bpm)?\b/i);
      const fromNearBpm = prompt.match(/(\d{2,3})\s*(?:bpm|tempo)/i);
      const bpm = Number((fromNearBpm && fromNearBpm[1]) || (match && match[1]) || 90);
      return Math.min(220, Math.max(40, Number.isFinite(bpm) ? bpm : 90));
    }

    function parseDurationMinutes(prompt) {
      const minMatch = prompt.match(/(\d+(?:\.\d+)?)\s*(?:m|min|mins|minute|minutes)\b/i);
      const hourMatch = prompt.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours)\b/i);
      let minutes = 10;
      if (hourMatch) minutes = Number(hourMatch[1]) * 60;
      else if (minMatch) minutes = Number(minMatch[1]);
      if (!Number.isFinite(minutes)) minutes = 10;
      return Math.max(10, Math.round(minutes));
    }

    function enrichPrompt(prompt, bpm) {
      const parts = [];
      for (const [regex, enriched] of keywordMap) if (regex.test(prompt)) parts.push(enriched);
      const flavor = parts.length ? parts.join(', ') : 'cinematic instrumental evolving arrangement';
      return `${prompt}. ${flavor}. ${bpm} BPM. high quality instrumental music.`;
    }

    function formatTime(sec) {
      if (!Number.isFinite(sec)) return '00:00';
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      return `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }

    function setProgress(pct, segDone, segTotal, etaSec) {
      $('progress').style.width = `${Math.max(0, Math.min(100, pct))}%`;
      $('progressMeta').textContent = `Segment ${segDone} of ${segTotal} • ETA ${etaSec > 0 ? `~${Math.ceil(etaSec)}s` : '—'}`;
    }

    function showError(msg, retryFn) {
      state.retryFn = retryFn || null;
      $('errorText').textContent = msg;
      $('errorBox').style.display = 'block';
    }

    function clearError() {
      $('errorBox').style.display = 'none';
      state.retryFn = null;
    }

    function updateTransportButtons(enabled) {
      for (const id of ['playBtn', 'pauseBtn', 'stopBtn', 'backBtn', 'fwdBtn', 'downloadBtn', 'regenBtn']) {
        $(id).disabled = !enabled;
      }
    }

    async function fetchWithRetry(url, retries = MAX_RETRIES) {
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 25000);
        try {
          const res = await fetch(url, { signal: controller.signal, mode: 'cors' });
          clearTimeout(timeout);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return await res.arrayBuffer();
        } catch (err) {
          clearTimeout(timeout);
          if (attempt >= retries) throw err;
          await new Promise((r) => setTimeout(r, 800 * (attempt + 1)));
        }
      }
      throw new Error('Unreachable');
    }

    function makeSegmentPrompt(basePrompt, index) {
      const suffixes = ['intro', 'verse', 'chorus', 'bridge', 'verse variation', 'chorus build', 'drop', 'breakdown', 'outro fade'];
      return `${basePrompt} ${suffixes[index % suffixes.length]} section ${index + 1}`;
    }

    async function generateSegments(basePrompt, durationMinutes) {
      const ctx = ensureAudio();
      const segmentCount = Math.ceil((durationMinutes * 60) / SEGMENT_SECONDS_EST);
      const buffers = new Array(segmentCount);
      const started = performance.now();
      let loaded = 0;

      for (let batchStart = 0; batchStart < segmentCount; batchStart += FETCH_BATCH) {
        const batchEnd = Math.min(segmentCount, batchStart + FETCH_BATCH);
        const jobs = [];
        for (let i = batchStart; i < batchEnd; i += 1) {
          jobs.push((async () => {
            const prompt = makeSegmentPrompt(basePrompt, i);
            const url = `https://gen.pollinations.ai/audio/${encodeURIComponent(prompt)}`;
            const binary = await fetchWithRetry(url);
            const decoded = await ctx.decodeAudioData(binary.slice(0));
            buffers[i] = decoded;
            loaded += 1;
            const pct = (loaded / segmentCount) * 100;
            const elapsed = (performance.now() - started) / 1000;
            const avg = elapsed / loaded;
            const eta = Math.max(0, avg * (segmentCount - loaded));
            $('status').textContent = `Loading segment ${loaded} of ${segmentCount}...`;
            setProgress(pct, loaded, segmentCount, eta);
          })());
        }
        await Promise.all(jobs);
      }
      return buffers;
    }

    function concatAudioBuffers(buffers) {
      const ctx = ensureAudio();
      const sampleRate = buffers[0].sampleRate || ctx.sampleRate;
      const channels = Math.max(...buffers.map((b) => b.numberOfChannels));
      const totalLength = buffers.reduce((sum, b) => sum + b.length, 0);
      const out = ctx.createBuffer(channels, totalLength, sampleRate);
      let offset = 0;
      for (const b of buffers) {
        for (let ch = 0; ch < channels; ch += 1) {
          const src = b.getChannelData(Math.min(ch, b.numberOfChannels - 1));
          out.getChannelData(ch).set(src, offset);
        }
        offset += b.length;
      }
      return out;
    }

    function stopPlayback() {
      if (state.source) {
        try { state.source.stop(); } catch (_) {}
        state.source.disconnect();
        state.source = null;
      }
      state.isPlaying = false;
      cancelAnimationFrame(state.raf);
      clearInterval(state.tick);
    }

    function play(offsetSeconds = state.pausedAt || 0) {
      if (!state.fullBuffer) return;
      const ctx = ensureAudio();
      if (ctx.state === 'suspended') ctx.resume();
      stopPlayback();
      const src = ctx.createBufferSource();
      src.buffer = state.fullBuffer;
      src.connect(state.gain);
      const now = ctx.currentTime;
      state.playbackStartedAt = now - offsetSeconds;
      state.source = src;
      state.isPlaying = true;
      src.start(now, Math.max(0, offsetSeconds));
      src.onended = () => {
        if (state.isPlaying) {
          state.pausedAt = 0;
          state.isPlaying = false;
          $('seek').value = '0';
          $('elapsed').textContent = '00:00';
          $('status').textContent = 'Playback ended.';
        }
      };
      $('status').textContent = 'Playing...';
      runVisualizer();
      startTick();
    }

    function pause() {
      if (!state.isPlaying || !state.audioCtx) return;
      state.pausedAt = Math.max(0, state.audioCtx.currentTime - state.playbackStartedAt);
      stopPlayback();
      $('status').textContent = 'Paused.';
    }

    function seekTo(seconds) {
      if (!state.fullBuffer) return;
      state.pausedAt = Math.max(0, Math.min(seconds, state.fullBuffer.duration));
      if (state.isPlaying) play(state.pausedAt);
      else $('elapsed').textContent = formatTime(state.pausedAt);
    }

    function currentPlaybackTime() {
      if (!state.fullBuffer || !state.audioCtx) return state.pausedAt || 0;
      return state.isPlaying ? Math.max(0, state.audioCtx.currentTime - state.playbackStartedAt) : (state.pausedAt || 0);
    }

    function runVisualizer() {
      const canvas = $('visualizer');
      const g = canvas.getContext('2d');
      const analyser = state.analyser;
      const data = new Uint8Array(analyser.frequencyBinCount);
      const draw = () => {
        state.raf = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(data);
        g.clearRect(0, 0, canvas.width, canvas.height);
        const grad = g.createLinearGradient(0, 0, canvas.width, 0);
        grad.addColorStop(0, '#a855f7');
        grad.addColorStop(0.5, '#22d3ee');
        grad.addColorStop(1, '#ec4899');
        g.fillStyle = grad;
        const bars = 90;
        const step = Math.max(1, Math.floor(data.length / bars));
        const barW = canvas.width / bars;
        for (let i = 0; i < bars; i += 1) {
          const val = data[i * step] / 255;
          const h = Math.pow(val, 1.2) * canvas.height;
          g.fillRect(i * barW + 1, canvas.height - h, Math.max(1, barW - 2), h);
        }
      };
      draw();
    }

    function startTick() {
      clearInterval(state.tick);
      state.tick = setInterval(() => {
        if (!state.fullBuffer || !state.audioCtx) return;
        const current = state.isPlaying ? Math.max(0, state.audioCtx.currentTime - state.playbackStartedAt) : state.pausedAt;
        const pct = (current / state.fullBuffer.duration) * 100;
        $('seek').value = String(Math.max(0, Math.min(100, pct)));
        $('elapsed').textContent = formatTime(current);
      }, 100);
    }

    function audioBufferToWav(buffer) {
      const numChannels = buffer.numberOfChannels;
      const sampleRate = buffer.sampleRate;
      const bits = 16;
      const blockAlign = (numChannels * bits) / 8;
      const dataSize = buffer.length * blockAlign;
      const out = new ArrayBuffer(44 + dataSize);
      const view = new DataView(out);
      const write = (offset, str) => { for (let i = 0; i < str.length; i += 1) view.setUint8(offset + i, str.charCodeAt(i)); };
      write(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      write(8, 'WAVE');
      write(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bits, true);
      write(36, 'data');
      view.setUint32(40, dataSize, true);
      let off = 44;
      for (let i = 0; i < buffer.length; i += 1) {
        for (let ch = 0; ch < numChannels; ch += 1) {
          const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i] || 0));
          view.setInt16(off, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
          off += 2;
        }
      }
      return new Blob([out], { type: 'audio/wav' });
    }

    async function generateMusic() {
      clearError();
      updateTransportButtons(false);
      $('progress').style.width = '0%';
      const prompt = $('prompt').value.trim();
      if (!prompt) return showError('Please describe the music you want.', generateMusic);
      state.lastPrompt = prompt;

      const durationFromPrompt = parseDurationMinutes(prompt);
      const durationOverride = Number($('durationSlider').value) || 10;
      const minutes = Math.max(10, state.durationTouched ? durationOverride : durationFromPrompt);
      const bpm = Number($('bpmOverride').value) || parseBpm(prompt);
      const basePrompt = enrichPrompt(prompt, bpm);
      const segmentCount = Math.ceil((minutes * 60) / SEGMENT_SECONDS_EST);

      $('nowInfo').textContent = `🎵 Generating: ${basePrompt.slice(0, 52)}${basePrompt.length > 52 ? '…' : ''}`;
      $('durInfo').textContent = `Duration: ${minutes} min • ${bpm} BPM`;
      $('segInfo').textContent = `Segments: ${segmentCount}`;
      $('status').textContent = 'Starting generation...';

      try {
        $('generateBtn').disabled = true;
        const segments = await generateSegments(basePrompt, minutes);
        state.fullBuffer = concatAudioBuffers(segments);
        $('total').textContent = formatTime(state.fullBuffer.duration);
        $('status').textContent = `Ready. Generated ${segments.length} segments.`;
        setProgress(100, segments.length, segments.length, 0);
        state.pausedAt = 0;
        $('seek').value = '0';
        $('elapsed').textContent = '00:00';
        updateTransportButtons(true);
      } catch (err) {
        console.error(err);
        $('status').textContent = 'Generation failed.';
        showError('Could not fetch/decode some audio segments. Please retry — slow or unstable connections can fail mid-stream.', generateMusic);
      } finally {
        $('generateBtn').disabled = false;
      }
    }

    function init() {
      EXAMPLES.forEach((text) => {
        const b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = text;
        b.addEventListener('click', () => { $('prompt').value = text; });
        $('chips').appendChild(b);
      });

      $('durationSlider').addEventListener('input', () => {
        state.durationTouched = true;
        $('durLabel').textContent = $('durationSlider').value;
      });
      $('volumeSlider').addEventListener('input', () => {
        const v = Number($('volumeSlider').value);
        $('volLabel').textContent = `${v}%`;
        if (state.gain) state.gain.gain.value = v / 100;
      });

      $('generateBtn').addEventListener('click', generateMusic);
      $('playBtn').addEventListener('click', () => play());
      $('pauseBtn').addEventListener('click', pause);
      $('stopBtn').addEventListener('click', () => {
        stopPlayback();
        state.pausedAt = 0;
        $('seek').value = '0';
        $('elapsed').textContent = '00:00';
        $('status').textContent = 'Stopped.';
      });
      $('backBtn').addEventListener('click', () => seekTo(currentPlaybackTime() - 15));
      $('fwdBtn').addEventListener('click', () => seekTo(currentPlaybackTime() + 15));
      $('seek').addEventListener('input', () => {
        if (!state.fullBuffer) return;
        const sec = (Number($('seek').value) / 100) * state.fullBuffer.duration;
        state.pausedAt = sec;
        $('elapsed').textContent = formatTime(sec);
      });
      $('seek').addEventListener('change', () => seekTo(state.pausedAt || 0));
      $('downloadBtn').addEventListener('click', () => {
        if (!state.fullBuffer) return;
        const blob = audioBufferToWav(state.fullBuffer);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'pollinations-music.wav';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1200);
      });
      $('regenBtn').addEventListener('click', () => {
        if (state.lastPrompt) {
          $('prompt').value = state.lastPrompt;
          generateMusic();
        }
      });
      $('retryBtn').addEventListener('click', () => state.retryFn && state.retryFn());

      $('durLabel').textContent = $('durationSlider').value;
      $('volLabel').textContent = `${$('volumeSlider').value}%`;
    }

    init();
  </script>
</body>
</html>
